<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#008e8b"/></marker></defs><style>text{font-family:Malgun Gothic,Arial,sans-serif;fill:#273440}.h{font-size:18px;font-weight:bold}.s{font-size:14px;fill:#5b6977}.a{stroke:#008e8b;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="820" fill="#f6f8fa"/><text x="45" y="48" font-size="27" font-weight="bold">KT Guide · 구현한 챗봇 흐름</text><text x="45" y="80" class="s">LangGraph는 retrieve와 generate 두 노드로 구성합니다. 외부 조회 단계는 retrieve 안에서 필요할 때 실행합니다.</text><rect x="30" y="110" width="1140" height="420" rx="18" fill="#e7f4f2"/><text x="50" y="143" class="h">노드 1 · retrieve</text><rect x="50" y="165" width="320" height="130" rx="12" fill="white" stroke="#d6e0e5"/><text x="68" y="196" class="h">질문·최근 대화 분석</text><text x="68" y="226" class="s">독립 검색문과 외부 검색어 생성</text><text x="68" y="251" class="s">명의자·납부자·사업자 구분</text><rect x="440" y="165" width="320" height="130" rx="12" fill="white" stroke="#d6e0e5"/><text x="458" y="196" class="h">상담 주제 선택</text><text x="458" y="226" class="s">주제 벡터 검색 + LLM 후보 선별</text><text x="458" y="251" class="s">직접 선택한 주제는 해당 범위 유지</text><rect x="830" y="165" width="320" height="130" rx="12" fill="white" stroke="#d6e0e5"/><text x="848" y="196" class="h">공식 저장 근거 검색</text><text x="848" y="226" class="s">대표 문서·명시한 상품 문서 포함</text><text x="848" y="251" class="s">유사도 / 선택 가능한 MMR</text><path d="M370 228H430" class="a"/><path d="M760 228H820" class="a"/><path d="M990 295V340" class="a"/><rect x="50" y="355" width="320" height="140" rx="12" fill="white" stroke="#d6e0e5"/><text x="68" y="386" class="h">근거 병합</text><text x="68" y="416" class="s">메타데이터와 공식 근거 유형 구분</text><text x="68" y="441" class="s">중복 제거 · 만료 외부 문서 제외</text><text x="68" y="466" class="s">주제 메타데이터는 정책 근거 아님</text><rect x="440" y="355" width="320" height="140" rx="12" fill="white" stroke="#d6e0e5"/><text x="458" y="386" class="h">선별 자료 수집·캐시·색인</text><text x="458" y="416" class="s">robots·호스트·크기·시간 제한</text><text x="458" y="441" class="s">HTML/PDF 추출 → kt_evidence</text><text x="458" y="466" class="s">검색 1시간 / 본문 6시간 캐시</text><rect x="830" y="355" width="320" height="140" rx="12" fill="white" stroke="#d6e0e5"/><text x="848" y="386" class="h">필요하면 외부 후보 검색</text><text x="848" y="416" class="s">공식 KT 주소 후보만 수집</text><text x="848" y="441" class="s">제목·요약으로 수집 전 LLM 선별</text><text x="848" y="466" class="s">실패하면 저장 묶음 또는 확인 불가</text><path d="M830 425H770" class="a"/><path d="M440 425H380" class="a"/><path d="M210 495V555" class="a"/><rect x="30" y="550" width="1140" height="170" rx="18" fill="#edf0f8"/><text x="50" y="582" class="h">노드 2 · generate</text><rect x="50" y="598" width="320" height="100" rx="12" fill="white" stroke="#d6e0e5"/><text x="68" y="629" class="h">공식 근거로 답변 생성</text><text x="68" y="659" class="s">직접 확인과 종합 추론 분리</text><rect x="440" y="598" width="320" height="100" rx="12" fill="white" stroke="#d6e0e5"/><text x="458" y="629" class="h">인용·추론 고지 검사</text><text x="458" y="659" class="s">실패 시 1회 보정 → 재검사</text><rect x="830" y="598" width="320" height="100" rx="12" fill="white" stroke="#d6e0e5"/><text x="848" y="629" class="h">대화 화면에 답변·출처</text><text x="848" y="659" class="s">검사 실패 시 답변 차단·오류 안내</text><path d="M370 648H430" class="a"/><path d="M760 648H820" class="a"/><text x="45" y="760" class="s">자동 검사는 인용 문구의 원문 존재를 확인합니다. 결론을 충분히 뒷받침하는지는 별도의 사람 검토가 필요합니다.</text><text x="45" y="788" class="s">화면: 주제별 대화 · 자연어 조건 탐색 · 납부 변경 상황 점검 · 처리 단계 표시 · 대화 저장/삭제/내보내기</text></svg>