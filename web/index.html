<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT Guide · 상담 도우미</title><link rel="stylesheet" href="/app.css"></head><body>
<aside id="sidebar"><div class="headerline"><div class="brand">KT <span>Guide</span></div><button id="closemenu" class="smallbtn">닫기</button></div><button class="new" id="new">＋ 새 대화</button><input id="topicFilter" aria-label="상담 주제 검색" placeholder="상담 주제 찾기"><div id="topicList"></div><details id="unsupportedBox" hidden><summary id="unsupportedTitle">근거 준비 중인 주제</summary><div id="unsupportedList" class="muted"></div></details><button id="explore" class="smallbtn">조건으로 상담 주제 찾기</button><button id="feature">납부 변경 상황 점검</button><div class="section">내 대화 · 이 기기에 저장</div><div id="threads"></div><div class="foot"><div id="status">연결 확인 중…</div><button id="clear">대화 모두 지우기</button><p>KT 공식 자료 기반 비공식 서비스</p></div></aside>
<main><header><div class="headerline"><button id="menu" class="smallbtn" aria-label="메뉴 열기">☰</button><div id="title">KT 상담 도우미</div></div><div class="tools"><button id="export">대화 내보내기</button><button id="delete">대화 삭제</button><span class="badge">로컬</span></div></header><div id="scroll"><div id="messages"></div><div id="exploreView" hidden></div></div><form class="composer" id="form"><div class="options"><span id="topicLabel">상담 주제 자동 선택</span><label id="externalLabel"><input type="checkbox" id="external"> 공식 웹 추가 조회</label></div><div class="inputbox"><textarea id="question" aria-label="질문" placeholder="KT 이용에 대해 궁금한 점을 물어보세요" rows="2" maxlength="6000"></textarea><button id="send" aria-label="보내기">↑</button></div><div class="notice">최근 대화와 질문은 GMS로 전달됩니다. 계좌번호·주민번호는 입력하지 마세요.<br>실제 처리와 비용은 가입 상품·계약·신청 시점에 따라 달라질 수 있습니다.</div></form></main>
<dialog id="featureDialog"><h2>납부 변경 상황 점검</h2><p class="muted">명의와 납부자를 구분해 공식 근거로 확인합니다. 이름이나 계좌번호는 필요 없습니다.</p><label>회선 명의자<input id="owner" value="본인" maxlength="30"></label><label>기존 납부자<input id="oldPayer" value="부모님" maxlength="30"></label><label>새 납부자<input id="newPayer" value="본인" maxlength="30"></label><label>유지할 결합·할인 상품<input id="bundle" placeholder="예: 프리미엄 가족결합 / 모름" maxlength="60"></label><div class="tools"><button id="featureClose">닫기</button><button id="featureStart">이 상황으로 질문 작성</button></div></dialog><script src="/app.js"></script></body></html>
